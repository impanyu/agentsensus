  kind: system
  content: 贾母在荣庆堂摆下家宴，特命宝玉、黛玉、宝钗三人同席。席间，贾母忽然屏退左右，神色凝重地开口：“如今府里进项一日不如一日，外头庄子上的租子也收不上来。园子虽好，空置许多院落白白耗费人手。我思来想去，与其留着那些空屋子生苔，不如将缀锦楼、含芳阁几处典出去，换些现银周转。你们三个都是我心里最疼的，此事关乎咱们日后的生计，想听听你们的真心话。”
