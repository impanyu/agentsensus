  kind: system
  content: 黑海粮食外运协议在安塔利亚续签谈判破裂，拉夫罗夫离场后，乌克兰南方港口遭到新一轮封锁性炮击，泽连斯基在敖德萨地下掩体召开紧急军事会议，普京在马里乌波尔秘密接见前线指挥官，绍伊古从奥列尼夫卡飞赴克里米亚协调反制行动。
